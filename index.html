<style>
:root{font-family:Georgia,"Times New Roman",serif;color-scheme:dark;background:#100d1d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}
body{color:#fff6f7;background:radial-gradient(ellipse at 50% 30%,#3d2841 0%,#1d162e 52%,#100d1d 100%);transition:background-color .5s}
body[data-time="day"]{color:#693d58;background:radial-gradient(ellipse at 50% 28%,#fffdf9 0%,#fbe8ed 54%,#ead4e7 100%)}
.page{min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;padding:max(20px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom));isolation:isolate;overflow:hidden}
.ambient{position:absolute;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 14% 14%,rgba(248,204,228,.08),transparent 28%),radial-gradient(circle at 91% 84%,rgba(233,157,201,.13),transparent 34%);}
body[data-time="day"] .ambient{background:radial-gradient(circle at 11% 12%,rgba(255,255,255,.82),transparent 32%),radial-gradient(circle at 85% 75%,rgba(232,138,178,.12),transparent 31%)}
.overline{font:500 10px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.39em;text-transform:uppercase;opacity:.67;margin-top:4px;z-index:2;text-align:center}
.art-wrap{width:min(94vw,520px,calc((100svh - 175px)*.89));min-width:240px;flex:0 1 auto;position:relative;margin:-8px auto -19px;will-change:transform;transform-origin:center 75%;animation:arrive 2.3s cubic-bezier(.2,.72,.2,1) both}
.bouquet-art{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 18px 30px rgba(7,5,14,.18))}
.greeting{font-weight:400;font-style:italic;line-height:1.12;letter-spacing:-.037em;text-align:center;font-size:clamp(29px,6.8vw,44px);margin:0;max-width:650px;text-wrap:balance;text-shadow:0 2px 24px rgba(255,201,226,.18);opacity:0;transform:translateY(12px);animation:messageIn 1.4s 1.15s ease-out forwards}
.flourish{display:flex;align-items:center;justify-content:center;gap:13px;margin:16px auto 0;opacity:.62;font-size:15px}
.flourish:before,.flourish:after{content:"";width:42px;height:1px;background:currentColor;opacity:.4}
.instruction{font:400 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.5;letter-spacing:.03em;margin:13px auto 0;text-align:center}
.replay{margin-top:12px;border:0;background:transparent;color:inherit;font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.55;cursor:pointer;padding:10px 16px;border-radius:30px}
.replay:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.replay:hover{opacity:1}
.petal{pointer-events:none;position:fixed;z-index:10;width:12px;height:17px;background:linear-gradient(135deg,#fff7f9,#f7aac9);border-radius:80% 5% 80% 5%;box-shadow:0 1px 7px #d479a966;animation:petalFly 1.35s ease-out forwards;left:var(--x);top:var(--y)}
@keyframes petalFly{0%{transform:translate(0,0) rotate(0deg) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.9);opacity:0}}
@keyframes arrive{from{opacity:0;transform:translateY(45px) scale(.89)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes messageIn{to{opacity:1;transform:translateY(0)}}
@media(min-height:840px){.page{padding-top:36px}.art-wrap{width:min(96vw,555px,calc((100svh - 210px)*.89))}}
@media(max-height:650px){.page{justify-content:flex-start}.art-wrap{width:min(86vw,calc((100svh - 140px)*.89));margin:-17px auto -30px}.overline{font-size:9px}.greeting{font-size:clamp(24px,6vw,36px)}.flourish{margin-top:7px}.instruction{margin-top:6px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.greeting{opacity:1;transform:none}.art-wrap{transform:none;opacity:1}}
</style>

<h1 id="greeting" class="greeting">Buonanotte angioletto evitante</h1>
<div class="flourish" aria-hidden="true">✦</div>
<p class="instruction">♡</p>
<button class="replay" id="replay" type="button" aria-label="Rivedi l'entrata del bouquet">↻ Rivedi la sorpresa</button>
</main>
<script>
(()=>{"use strict";
 const greeting=document.getElementById("greeting"),bouquet=document.getElementById("bouquet");
 function syncClock(){const h=new Date().getHours(),day=h>=7&&h<20;
   document.body.dataset.time=day?"day":"night";
   greeting.textContent=(day?"Buongiorno":"Buonanotte")+" angioletto evitante";
   document.querySelector('meta[name="theme-color"]').setAttribute("content",day?"#fbe8ed":"#160e23");
 }
 syncClock();setInterval(syncClock,60*1000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncClock()});
 function petals(e){if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
   const b=bouquet.getBoundingClientRect(),x=e&&e.clientX?e.clientX:b.left+b.width/2,y=e&&e.clientY?e.clientY:b.top+b.height*.45;
   for(let i=0;i<7;i++){let p=document.createElement("span");p.className="petal";
     p.style.setProperty("--x",x+"px");p.style.setProperty("--y",y+"px");
     p.style.setProperty("--dx",((Math.random()-.5)*180)+"px");
     p.style.setProperty("--dy",(-40-Math.random()*155)+"px");
     p.style.setProperty("--rot",((Math.random()-.5)*600)+"deg");
     document.body.appendChild(p);p.addEventListener("animationend",()=>p.remove(),{once:true});
   }
 }
 bouquet.addEventListener("pointerdown",petals);
 bouquet.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();petals()}});
 document.getElementById("replay").addEventListener("click",()=>{bouquet.style.animation="none";void bouquet.offsetWidth;bouquet.style.animation="";greeting.style.animation="none";void greeting.offsetWidth;greeting.style.animation=""});
})();
</script>
