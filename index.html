<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3f6">
<meta name="color-scheme" content="light">
<meta name="description" content="Un buongiorno speciale, pieno di fiori che sbocciano.">
<title>Just for you ✨</title>
<style>
:root{color-scheme:light;font-family:Georgia,"Times New Roman",serif;background:#fff7f4;color:#aa487a}
*{box-sizing:border-box}
html,body{min-height:100%;width:100%;margin:0;overflow-x:hidden}
body{background:radial-gradient(circle at 82% 5%,#fffae8 0,transparent 31%),radial-gradient(ellipse at 6% 29%,#fff 0,transparent 55%),linear-gradient(163deg,#fff9f3 0%,#fff0f5 48%,#fce1ee 100%)}
.main{min-height:100svh;width:100%;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 12px max(13px,env(safe-area-inset-bottom));overflow:hidden;isolation:isolate}
.sun{position:absolute;top:-100px;right:-120px;width:min(80vw,430px);aspect-ratio:1;z-index:-2;border-radius:50%;background:radial-gradient(circle,#fffdf5 0 16%,#fff3ce 30%,rgba(255,225,208,.14) 65%,transparent 75%);pointer-events:none}
.ring{position:absolute;z-index:-2;left:-200px;top:19%;width:490px;height:490px;border:1px solid rgba(247,177,204,.27);border-radius:50%;pointer-events:none}
.ring:after{content:"";position:absolute;inset:29px;border-radius:50%;border:1px solid rgba(248,199,216,.2)}
.label{font:600 10px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#c284a3;opacity:0;animation:fadeIn .8s .05s both;z-index:1;text-align:center}
.scene{position:relative;width:min(97vw,545px,calc((100svh - 186px)*.78));min-width:min(95vw,228px);aspect-ratio:690/850;margin:-10px auto -23px;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:2}
.scene:focus-visible{outline:2px solid #d17baa;outline-offset:-6px;border-radius:20px}
.bouquet{display:block;width:100%;height:100%;overflow:visible}
.bouquet-shell{width:100%;height:100%;animation:gentleSway 7s 5s ease-in-out infinite alternate;transform-origin:50% 88%}
.bloom-wind{animation:headSway var(--wind) ease-in-out var(--phase) infinite alternate;transform-origin:0 38px}
.unfurl{transform-box:fill-box;transform-origin:50% 95%;opacity:0;animation:unfurl 1.25s cubic-bezier(.18,.7,.23,1.16) var(--pdelay) both}
.tulip-leaf{transform-box:fill-box;transform-origin:50% 94%;opacity:0;animation:tulipOpen 1.65s cubic-bezier(.2,.76,.26,1.05) var(--pdelay) both}
.heart{transform-box:fill-box;transform-origin:center;animation:heartReveal .8s var(--pdelay) both}
.stem{stroke-dasharray:1;stroke-dashoffset:1;animation:growStem 1.7s ease-out var(--stemdelay) forwards}
.leaf-reveal{transform-box:fill-box;transform-origin:15% 90%;opacity:0;animation:leafGrow 1.1s var(--ldelay) ease-out both}
.twig,.sprig{opacity:0;animation:fadeIn 1s var(--ldelay,.45s) both}
.paper-wrap{opacity:0;animation:wrapIn 1s 2.1s cubic-bezier(.2,.8,.25,1) both}
.scene-shadow{position:absolute;left:13%;right:13%;bottom:5%;height:6%;background:#d695b0;opacity:.16;filter:blur(18px);border-radius:100%;z-index:-1}
.message{z-index:3;text-align:center;max-width:620px;padding:0 8px;width:100%;margin-top:-1px}
.message h1{font-weight:400;font-style:italic;letter-spacing:-.04em;font-size:clamp(29px,7vw,47px);line-height:1.12;margin:0 auto;color:#a94279;text-wrap:balance;opacity:0;animation:textUp 1s 3.9s both}
.message p{font:600 clamp(13px,3.4vw,18px)/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.045em;margin:12px auto 0;color:#aa738e;opacity:0;animation:textUp .9s 4.45s both}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:11px 0 0;color:#d49abb;opacity:0;animation:fadeIn 1s 4.9s both;font-size:16px}
.divider:before,.divider:after{content:"";height:1px;width:52px;background:linear-gradient(90deg,transparent,#e3aec9)}
.divider:after{transform:scaleX(-1)}
.hint{z-index:3;font:400 11px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.02em;color:#b5859b;margin:8px 0 0;opacity:0;animation:fadeIn 1s 5s both;text-align:center}
.replay{z-index:3;margin-top:8px;border:1px solid #edc7d9;background:rgba(255,255,255,.4);color:#a8698b;border-radius:999px;padding:8px 13px;font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:0;animation:fadeIn 1s 5.4s both;cursor:pointer}
.replay:focus-visible{outline:2px solid #b14c86;outline-offset:3px}
.butterfly{position:absolute;z-index:4;pointer-events:none;width:46px;top:18%;right:4%;animation:fly 7s 1.4s ease-in-out infinite alternate}
.butterfly svg{display:block;width:100%;height:auto;overflow:visible}
.wing{transform-box:fill-box;transform-origin:50% 70%;animation:flap .55s ease-in-out infinite alternate}
.butterfly .wing-r{animation-delay:-.28s}
.float-petal{position:absolute;z-index:1;pointer-events:none;left:var(--x);top:105%;width:10px;height:16px;opacity:0;background:linear-gradient(140deg,#fffdf9,#f5b6d2 82%);border-radius:85% 7% 88% 10%;animation:floatBy var(--dur) linear var(--delay) infinite}
.float-petal:nth-of-type(even){background:linear-gradient(140deg,#fff3f8,#dbc0ee)}
.spark{position:absolute;pointer-events:none;z-index:3;color:#fffefa;text-shadow:0 0 11px rgba(223,133,169,.55);font-size:var(--sz);left:var(--x);top:var(--y);animation:shine var(--dur) var(--delay) ease-in-out infinite}
.burst{pointer-events:none;position:fixed;z-index:20;left:var(--x);top:var(--y);height:15px;width:10px;border-radius:82% 12% 83% 9%;background:linear-gradient(125deg,#fffdf9,#f0a9c8);animation:burst 1.3s ease-out forwards}
@keyframes fadeIn{to{opacity:1}}
@keyframes textUp{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:translateY(0)}}
@keyframes growStem{to{stroke-dashoffset:0}}
@keyframes leafGrow{0%{opacity:0;transform:scale(.1) rotate(-25deg)}70%{opacity:1;transform:scale(1.1) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes unfurl{0%{opacity:0;transform:scale(.06) rotate(-46deg)}45%{opacity:1}74%{transform:scale(1.12) rotate(6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes tulipOpen{0%{opacity:0;transform:scaleX(.04) scaleY(.2) rotate(var(--open))}64%{opacity:1;transform:scaleX(1.05) scaleY(1.03) rotate(0)}100%{opacity:1;transform:scale(1)}}
@keyframes heartReveal{0%{opacity:0;transform:scale(.1)}80%{opacity:1;transform:scale(1.13)}100%{opacity:1;transform:scale(1)}}
@keyframes headSway{0%{transform:rotate(-1.9deg)}100%{transform:rotate(2.2deg)}}
@keyframes gentleSway{0%{transform:rotate(-.65deg) translateY(0)}100%{transform:rotate(.7deg) translateY(-5px)}}
@keyframes wrapIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes fly{0%{transform:translate(0,0) rotate(-12deg)}40%{transform:translate(-36px,22px) rotate(8deg)}100%{transform:translate(-70px,-40px) rotate(-9deg)}}
@keyframes flap{from{transform:scaleX(.48)}to{transform:scaleX(1)}}
@keyframes floatBy{0%{opacity:0;transform:translate3d(0,0,0) rotate(0deg)}10%{opacity:.76}85%{opacity:.66}100%{opacity:0;transform:translate3d(var(--drift),-110svh,0) rotate(360deg)}}
@keyframes shine{0%,100%{opacity:.2;transform:scale(.56) rotate(0)}50%{opacity:1;transform:scale(1.22) rotate(23deg)}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.8)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
@media(max-height:690px){.scene{width:min(94vw,calc((100svh - 150px)*.76));margin:-23px auto -30px}.message h1{font-size:clamp(26px,6.2vw,37px)}.message p{margin-top:8px}.divider{margin-top:4px}.hint{margin-top:4px}.replay{margin-top:4px}}
@media(max-width:359px){.scene{width:min(97vw,calc((100svh - 180px)*.8))}.message h1{font-size:28px}.message p{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.float-petal,.butterfly,.spark{display:none}.stem{stroke-dashoffset:0!important}.unfurl,.tulip-leaf,.leaf-reveal,.heart,.paper-wrap,.message h1,.message p,.divider,.hint,.replay,.label{opacity:1!important;transform:none!important}}
</style>

  node.style.setProperty('--x',x+'px');
  node.style.setProperty('--y',y+'px');
  node.style.setProperty('--dx',((Math.random()-.5)*195)+'px');
  node.style.setProperty('--dy',(-40-Math.random()*152)+'px');
  node.style.setProperty('--rot',((Math.random()-.5)*520)+'deg');
  document.body.appendChild(node);
  node.addEventListener('animationend',()=>node.remove(),{once:true});
 }
}
