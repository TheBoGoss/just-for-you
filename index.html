<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f6">
<meta name="color-scheme" content="light">
<meta name="description" content="Un piccolo pensiero, solo per te.">
<title>Just for you ♡</title>
<style>
:root{font-family:Georgia,"Times New Roman",serif;color-scheme:light;background:#fff7fa;color:#904968}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:clip}
body{background:radial-gradient(ellipse at 75% 2%,rgba(255,253,218,.85),transparent 44%),radial-gradient(ellipse at 6% 32%,rgba(255,255,255,.92),transparent 49%),linear-gradient(158deg,#fff9f4 0%,#fff0f6 49%,#f8dce9 100%)}
.page{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;min-height:var(--view-height,100dvh);width:100%;padding:max(15px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden}
.sun{position:absolute;z-index:-2;top:-150px;right:-150px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,#fffefa 0%,#fff8db 20%,rgba(255,239,213,.25) 47%,transparent 74%);pointer-events:none}
.mist{position:absolute;z-index:-2;pointer-events:none;left:-20%;top:18%;width:80%;height:43%;border-radius:50%;border:1px solid rgba(236,158,189,.19)}
.mist:after{content:"";position:absolute;inset:24px;border-radius:50%;border:1px solid rgba(233,174,198,.12)}
.overline{z-index:2;font:650 10px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#c48ba6;text-align:center;margin:0;opacity:0;animation:fade .75s .15s both}
.scene{position:relative;width:min(95vw,520px,var(--scene-width,450px));min-width:0;flex:0 0 auto;aspect-ratio:720/870;margin:-9px auto -22px;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:1}
.scene:focus-visible{outline:2px solid #bd7ca4;outline-offset:1px;border-radius:25px}
.bouquet{width:100%;height:100%;display:block;overflow:visible}
.ghost-position{transform-box:view-box}
.ghost-appear{opacity:0;transform-box:fill-box;transform-origin:50% 72%;animation:ghostBloom 1.25s cubic-bezier(.2,.74,.2,1.09) var(--enter) both}
.ghost-bob{transform-box:fill-box;transform-origin:50% 72%;animation:ghostFloat var(--float) ease-in-out var(--phase) infinite alternate}
.stem{stroke-dasharray:1;stroke-dashoffset:1;animation:stemGrow 1.35s var(--grow) ease-out forwards}
.leaf{opacity:0;transform-box:fill-box;transform-origin:12% 90%;animation:leafReveal .9s var(--leaf-delay) cubic-bezier(.2,.8,.3,1.12) both}
.filler{opacity:0;animation:fade 1s var(--enter) both}
.paper-wrap{opacity:0;animation:paperUp 1.15s 3s cubic-bezier(.2,.8,.3,1) both}
.tag-in{opacity:0;transform-box:fill-box;transform-origin:22% 13%;animation:tagDrop 1.15s var(--tag-delay) cubic-bezier(.2,.76,.3,1) both}
.tag-rock{transform-box:fill-box;transform-origin:20% 13%;animation:tagSwing 4.5s 7s ease-in-out infinite alternate}
.wave{animation:littleWave 1.6s 5.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:7% 70%}
.content{width:100%;max-width:580px;text-align:center;padding:0 4px;z-index:3;margin:0 auto}
.content h1{font-size:clamp(38px,9vw,56px);font-style:italic;letter-spacing:-.055em;line-height:1.08;font-weight:400;color:#a64b7c;margin:0;opacity:0;animation:textRise .9s 5.0s both}
.content p{font:400 clamp(14px,3.65vw,18px)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#98617f;max-width:480px;margin:13px auto 0;opacity:0;animation:textRise 1s 5.5s both;text-wrap:balance}
.ornament{font-size:19px;color:#d19ab8;text-align:center;margin:11px auto 0;opacity:0;animation:fade 1.1s 6.2s both}
.replay{z-index:4;min-height:38px;border-radius:999px;border:1px solid #e8bdd3;background:rgba(255,255,255,.48);color:#a46b8a;padding:9px 17px;margin:12px auto 0;font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;opacity:0;animation:fade .9s 6.5s both}
.replay:focus-visible{outline:2px solid #b26e9a;outline-offset:3px}
.floating-heart{position:absolute;z-index:0;pointer-events:none;left:var(--x);top:var(--y);color:var(--color);font-size:var(--size);opacity:0;animation:heartDrift var(--duration) var(--delay) ease-in-out infinite}
.spark{position:absolute;z-index:2;pointer-events:none;color:#fffdfa;text-shadow:0 0 8px #f7bad6;left:var(--x);top:var(--y);font-size:var(--size);opacity:0;animation:twinkle 4s var(--delay) ease-in-out infinite}
.boo{position:absolute;z-index:7;left:50%;top:12%;pointer-events:none;font:italic 600 20px Georgia,serif;color:#ac5891;background:rgba(255,255,255,.93);border:1px solid #eabbd0;border-radius:18px;padding:6px 15px;box-shadow:0 10px 28px rgba(188,107,146,.10);opacity:0;transform:translate(-50%,8px)}
.boo.pop{animation:booAppear 1.4s ease-out forwards}
.tap-heart{position:fixed;z-index:20;pointer-events:none;left:var(--x);top:var(--y);color:var(--color);font-size:var(--size);animation:heartBurst 1.3s ease-out forwards}
html:not(.ready) .seq,html:not(.ready) .ambient,html:not(.ready) .overline,html:not(.ready) .content h1,html:not(.ready) .content p,html:not(.ready) .ornament,html:not(.ready) .replay,html:not(.ready) .floating-heart,html:not(.ready) .spark,
html.suspended .seq,html.suspended .ambient,html.suspended .overline,html.suspended .content h1,html.suspended .content p,html.suspended .ornament,html.suspended .replay,html.suspended .floating-heart,html.suspended .spark{animation-play-state:paused!important}
html:not(.ready) .scene{pointer-events:none}
#preload{position:absolute;z-index:5;pointer-events:none;left:50%;top:44%;transform:translate(-50%,-50%);color:#e9acc8;font-size:29px;opacity:.75;transition:opacity .35s}
html.ready #preload{opacity:0}
@keyframes fade{to{opacity:1}}
@keyframes ghostBloom{0%{opacity:0;transform:translateY(32px) scale(.12) rotate(-15deg)}62%{opacity:1;transform:translateY(-8px) scale(1.10) rotate(4deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes ghostFloat{0%{transform:translateY(1px) rotate(-2.1deg)}100%{transform:translateY(-5px) rotate(2.1deg)}}
@keyframes stemGrow{to{stroke-dashoffset:0}}
@keyframes leafReveal{0%{opacity:0;transform:scale(.1) rotate(-30deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes paperUp{0%{opacity:0;transform:translateY(38px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tagDrop{0%{opacity:0;transform:translate(28px,-22px) rotate(-16deg) scale(.74)}65%{opacity:1;transform:translate(-3px,4px) rotate(5deg) scale(1.04)}100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes tagSwing{from{transform:rotate(-2.7deg)}to{transform:rotate(3.2deg)}}
@keyframes littleWave{from{transform:rotate(-6deg)}to{transform:rotate(12deg)}}
@keyframes textRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6) rotate(0)}50%{opacity:.85;transform:scale(1.23) rotate(24deg)}}
@keyframes heartDrift{0%,100%{opacity:0;transform:translate(0,4px) scale(.75)}50%{opacity:.58;transform:translate(10px,-15px) scale(1)}}
@keyframes heartBurst{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot))}}
@keyframes booAppear{0%{opacity:0;transform:translate(-50%,12px) scale(.7)}22%{opacity:1;transform:translate(-50%,-7px) scale(1.09)}45%{transform:translate(-50%,0) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-17px) scale(.95)}}
@media(max-width:600px){.ghost-bob{animation-duration:6.7s}.floating-heart:nth-of-type(n+7){display:none}.spark:nth-of-type(n+5){display:none}}
@media(max-width:360px){.scene{margin:-6px auto -14px}.content h1{font-size:clamp(32px,9vw,40px)}.content p{font-size:13px;margin-top:9px}.ornament{margin-top:6px}.replay{margin-top:8px}}
@media(max-height:650px){.scene{margin:-14px auto -25px}.content p{margin-top:7px}.ornament{margin-top:5px}.replay{margin-top:5px}}
@media(orientation:landscape) and (max-height:490px){.page{justify-content:flex-start;overflow:visible}.scene{width:min(55vw,310px)!important;margin:-8px auto -15px}.content p{max-width:490px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.seq,.ghost-appear,.leaf,.filler,.paper-wrap,.tag-in,.overline,.content h1,.content p,.ornament,.replay{opacity:1!important;transform:none!important}.stem{stroke-dashoffset:0!important}.floating-heart,.spark{display:none}}
</style>
</head>

<span class="spark ambient" aria-hidden="true" style="--x:10%;--y:15%;--size:13px;--delay:.4s">✦</span><span class="spark ambient" aria-hidden="true" style="--x:79%;--y:27%;--size:18px;--delay:1.8s">✦</span><span class="spark ambient" aria-hidden="true" style="--x:27%;--y:38%;--size:10px;--delay:2.6s">✦</span><span class="spark ambient" aria-hidden="true" style="--x:88%;--y:54%;--size:12px;--delay:3.4s">✦</span>
<div class="boo" id="boo" aria-hidden="true">Boo! ♡</div>
</div>
<div class="content">
<h1>Buongiorno</h1>
<p>Anche quando sparisci, resti comunque un pensiero bello</p>
<div class="ornament" aria-hidden="true">♡</div>
</div>
<button class="replay" id="replay" type="button">↻ Rivedi la sorpresa</button>
</main>
<script>
(()=>{'use strict';
const root=document.documentElement,scene=document.getElementById('scene'),replay=document.getElementById('replay'),boo=document.getElementById('boo');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let loaded=document.readyState==='complete',started=false,starting=false,measurementPending=false;
function measure(){
 const vv=window.visualViewport;
 const w=Math.max(280,Math.round(vv?vv.width:window.innerWidth));
 const h=Math.max(320,Math.round(vv?vv.height:window.innerHeight));
 root.style.setProperty('--view-height',h+'px');
 const sceneW=Math.max(195,Math.min(w*.95,520,(h-210)*(720/870)));
 root.style.setProperty('--scene-width',Math.round(sceneW)+'px');
}
function queueMeasure(){
 if(measurementPending)return;
 measurementPending=true;
 requestAnimationFrame(()=>{measurementPending=false;measure()});
}
measure();
window.addEventListener('resize',queueMeasure,{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',queueMeasure,{passive:true});
window.addEventListener('orientationchange',queueMeasure,{passive:true});
function start(){
 if(started||starting||!loaded||document.hidden)return;
 starting=true;
 const fontReady=document.fonts&&document.fonts.ready?document.fonts.ready.catch(()=>{}):Promise.resolve();
 fontReady.then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
   window.setTimeout(()=>{
    starting=false;
    if(started||document.hidden)return;
    measure();started=true;root.classList.add('ready');
   },450);
 })));
}
function visibility(){
 root.classList.toggle('suspended',document.hidden);
 if(!document.hidden){queueMeasure();start()}
}
document.addEventListener('visibilitychange',visibility);
window.addEventListener('pageshow',visibility);
window.addEventListener('pagehide',()=>root.classList.add('suspended'));
window.addEventListener('focus',start);
if(loaded)start();
else window.addEventListener('load',()=>{loaded=true;start()},{once:true});
function surprise(evt){
 if(!started||reduced.matches)return;
 const r=scene.getBoundingClientRect();
 const x=evt&&typeof evt.clientX==='number'&&evt.clientX>0?evt.clientX:r.left+r.width/2;
 const y=evt&&typeof evt.clientY==='number'&&evt.clientY>0?evt.clientY:r.top+r.height*.38;
 const bx=(x-r.left)/r.width*100,by=(y-r.top)/r.height*100;
 boo.style.left=Math.max(19,Math.min(82,bx))+'%';
 boo.style.top=Math.max(6,Math.min(78,by-18))+'%';
 boo.classList.remove('pop');void boo.offsetHeight;boo.classList.add('pop');
 for(let i=0;i<7;i++){
  const el=document.createElement('span');el.className='tap-heart';el.textContent=i%3?'♡':'✦';
  el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');
  el.style.setProperty('--color',i%3?'#dd87af':'#edc7a0');
  el.style.setProperty('--size',(15+i%3*4)+'px');
  el.style.setProperty('--dx',((Math.random()-.5)*170)+'px');
  el.style.setProperty('--dy',(-25-Math.random()*150)+'px');
  el.style.setProperty('--rot',((Math.random()-.5)*300)+'deg');
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove(),{once:true});
 }
}
scene.addEventListener('pointerdown',surprise);
scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();surprise(null)}});
replay.addEventListener('click',()=>{
 if(reduced.matches)return;
 root.classList.remove('ready');
 const all=document.querySelectorAll('.seq,.overline,.content h1,.content p,.ornament,.replay');
 all.forEach(el=>{el.style.animation='none'});
 void scene.offsetHeight;
 all.forEach(el=>{el.style.animation=''});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{root.classList.add('ready')}));
});
})();</script>
