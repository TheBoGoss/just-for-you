<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070610">
  <meta name="description" content="Una piccola sorpresa, solo per te.">
  <title>Just for you ✧</title>
  <link rel="stylesheet" href="./style.css?v=2.0">
  <script src="./config.js?v=2.0"></script>
  <script src="./app.js?v=2.0" defer></script>
</head>
<body>
  <main class="experience" aria-label="Una piccola sorpresa animata">
    <div class="scene" id="scene">
      <canvas id="art" aria-label="Un fiore luminoso prende vita nella notte" role="img"></canvas>
      <div class="film-grain" aria-hidden="true"></div>
      <div class="edge-shade" aria-hidden="true"></div>
      <div class="opening" id="opening" aria-hidden="true"><span class="opening__star">✧</span><span>qualcosa di piccolo, per te</span></div>
      <div class="dedication" id="dedication" aria-live="polite" aria-atomic="true">
        <div class="dedication__spark" aria-hidden="true">✧ &nbsp; ✧ &nbsp; ✧</div>
        <p id="message"></p>
        <div class="dedication__rule" aria-hidden="true"></div>
      </div>
      <button class="replay" id="replay" type="button" aria-label="Ricomincia l'animazione"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 11.5a9 9 0 1 0 2.7-6.4M3 4v5h5"/></svg>Rivedi la magia</button>
      <div class="hint" id="hint" aria-hidden="true">tocca lo schermo ✦</div>
    </div>
    <noscript>Attiva JavaScript per vedere la sorpresa.</noscript>
  </main>
</body>
</html>
